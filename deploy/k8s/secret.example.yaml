# Template only — do not commit real values. Create the live Secret out of band:
#
#   kubectl -n thoth create secret generic thoth \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_EMAIL=admin@example.com \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)"
#
# SESSION_SECRET is optional: with none set the app generates one into the volume and
# reuses it, which is fine for a single replica. Set it explicitly if you ever want to
# restore the volume elsewhere without signing everyone out.
#
# ADMIN_EMAIL/ADMIN_PASSWORD only bootstrap the first administrator so nobody has to race
# for the setup page on a public URL. Remove them once the account exists.
#
# Everything else — SMTP, OIDC client secrets, branding, work mode — is configured in the
# UI and stored in the database, not here.
apiVersion: v1
kind: Secret
metadata:
  name: thoth
  labels:
    app.kubernetes.io/name: thoth
type: Opaque
stringData:
  SESSION_SECRET: ""
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
