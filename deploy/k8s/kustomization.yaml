apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thoth

# secret.example.yaml is deliberately not listed: create the real Secret out of band so no
# credential is ever committed.
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: thoth
      app.kubernetes.io/part-of: thoth
